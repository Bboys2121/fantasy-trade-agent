name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the minimum version we claim to support
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check . ../mcp_server
      - run: pytest              # uses fixtures only: no ESPN or Anthropic calls, no secrets

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build       # type-checks with tsc, then bundles with Vite

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fantasy-trade-agent .
